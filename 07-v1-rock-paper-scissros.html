<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Rock paper scissors</h1>
    <button onclick="
        const computerMove =  computer_choice();
        //alert(computerMove);
        let result = '';
        if (computerMove === 'rock')
        {
            result = 'tie';
        }
        else if (computerMove === 'paper')
        {
            result = 'You lose';
        }
        else if (computerMove === 'scissors')
        {
            result = 'You won';
        }
        alert(`You picked rock. Computer picked ${computerMove}. Result: ${result}.`)
    ">rock</button>
    <button onclick="
        computerMove = computer_choice();
        result = '';
        if (computerMove === 'rock')
        {
            result = 'You won';
        }
        else if (computerMove === 'paper')
        {
            result = 'tie';
        }
        else if (computerMove === 'scissors')
        {
            result = 'You lose';
        }
        alert(`You picked paper. Computer picked ${computerMove}. Result: ${result}.`)    
    
    ">paper</button>
    <button onclick="
        computerMove = computer_choice();
        result = '';
        if (computerMove === 'rock')
        {
            result = 'You lose';
        }
        else if (computerMove === 'paper')
        {
            result = 'You won';
        }
        else if (computerMove === 'scissors')
        {
            result = 'tie';
        }
        alert(`You picked scissors. Computer picked ${computerMove}. Result: ${result}.`)    
    ">scissors</button>

    <script>
        
        function computer_choice()
        {   let computerMove = '';
            let randomNumber = Math.random();
            
            if (randomNumber>=0 && randomNumber<1/3)
            {
                computerMove = 'rock';
            }
            else if (randomNumber>=1/3 && randomNumber<2/3)
            {
                computerMove = 'paper';
            }
            else if (randomNumber>=2/3 && randomNumber<1)
            {
                computerMove = 'scissors';
            }
            return computerMove;
        }
    </script>
</body>
</html>
